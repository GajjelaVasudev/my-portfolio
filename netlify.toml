# ==============================================================================
# Netlify Configuration for React + Vite + TypeScript Single Page App (SPA)
# ==============================================================================

[build]
  command = "npm run build"
  publish = "dist"

# Environment variables for production build
[build.environment]
  NODE_VERSION = "20"

# SPA routing redirect rule: sends all client route requests to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
